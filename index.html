<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏸 Badminton Dashboard | Arpit's Sessions</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f26;
            --bg-card: #232b36;
            --bg-hover: #2d3844;
            --accent-primary: #00d4aa;
            --accent-secondary: #00b894;
            --accent-tertiary: #6c5ce7;
            --accent-orange: #fd9644;
            --accent-red: #ff6b6b;
            --accent-blue: #54a0ff;
            --accent-yellow: #feca57;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --text-muted: #718096;
            --border: #2d3748;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .last-updated {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card.accent-green .stat-value { color: var(--accent-primary); }
        .stat-card.accent-orange .stat-value { color: var(--accent-orange); }
        .stat-card.accent-purple .stat-value { color: var(--accent-tertiary); }
        .stat-card.accent-blue .stat-value { color: var(--accent-blue); }
        .stat-card.accent-red .stat-value { color: var(--accent-red); }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .chart-card.full-width {
            grid-column: 1 / -1;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .chart-container.small {
            height: 250px;
        }

        /* Session Cards */
        .sessions-section {
            margin-top: 3rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .session-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .session-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .session-date {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .session-time {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .training-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .badge-aerobic {
            background: rgba(0, 212, 170, 0.2);
            color: var(--accent-primary);
        }

        .badge-recovery {
            background: rgba(253, 150, 68, 0.2);
            color: var(--accent-orange);
        }

        .session-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .session-stat {
            text-align: center;
        }

        .session-stat-value {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .session-stat-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .session-details {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            font-size: 0.9rem;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
        }

        .detail-label {
            color: var(--text-secondary);
        }

        .detail-value {
            font-weight: 500;
        }

        /* HR Zone Bar */
        .hr-zone-bar {
            display: flex;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .hr-zone-bar .zone {
            transition: width 0.3s;
        }

        .zone-1 { background: #3498db; }
        .zone-2 { background: #2ecc71; }
        .zone-3 { background: #f1c40f; }
        .zone-4 { background: #e67e22; }
        .zone-5 { background: #e74c3c; }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }

        footer a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .sessions-grid {
                grid-template-columns: 1fr;
            }

            .session-stats {
                grid-template-columns: repeat(3, 1fr);
            }

            .session-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🏸</div>
            <h1>Badminton Dashboard</h1>
            <p class="subtitle">Track every smash, every rally, every gain</p>
            <p class="last-updated" id="lastUpdated">Loading...</p>
        </header>

        <div id="app">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading session data...</p>
            </div>
        </div>
    </div>

    <script>
        // Color palette for charts
        const COLORS = {
            primary: '#00d4aa',
            secondary: '#6c5ce7',
            orange: '#fd9644',
            red: '#ff6b6b',
            blue: '#54a0ff',
            yellow: '#feca57',
            zones: ['#3498db', '#2ecc71', '#f1c40f', '#e67e22', '#e74c3c']
        };

        // Chart.js defaults
        Chart.defaults.color = '#a0aec0';
        Chart.defaults.borderColor = '#2d3748';
        Chart.defaults.font.family = "'Inter', sans-serif";

        // Format date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        // Format time
        function formatTime(timeStr) {
            const parts = timeStr.split(' ')[1];
            const [hours, minutes] = parts.split(':');
            const h = parseInt(hours);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return `${h12}:${minutes} ${ampm}`;
        }

        // Calculate totals
        function calculateStats(sessions) {
            const totalSessions = sessions.length;
            const totalCalories = sessions.reduce((sum, s) => sum + s.calories, 0);
            const totalDuration = sessions.reduce((sum, s) => sum + s.durationMinutes, 0);
            const avgDuration = totalDuration / totalSessions;
            const bestTrainingLoad = Math.max(...sessions.map(s => s.trainingLoad));
            const avgHR = Math.round(sessions.reduce((sum, s) => sum + s.avgHR, 0) / totalSessions);
            
            return { totalSessions, totalCalories, totalDuration, avgDuration, bestTrainingLoad, avgHR };
        }

        // Render the dashboard
        function render(sessions) {
            // Sort sessions by date (newest first for cards, oldest first for charts)
            const sessionsNewest = [...sessions].sort((a, b) => new Date(b.date) - new Date(a.date));
            const sessionsOldest = [...sessions].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            const stats = calculateStats(sessions);
            const latestSession = sessionsNewest[0];
            
            document.getElementById('lastUpdated').textContent = 
                `Last session: ${formatDate(latestSession.date)} • ${sessions.length} sessions tracked`;

            const app = document.getElementById('app');
            app.innerHTML = `
                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card accent-green">
                        <div class="stat-icon">🏸</div>
                        <div class="stat-value">${stats.totalSessions}</div>
                        <div class="stat-label">Total Sessions</div>
                    </div>
                    <div class="stat-card accent-orange">
                        <div class="stat-icon">🔥</div>
                        <div class="stat-value">${stats.totalCalories.toLocaleString()}</div>
                        <div class="stat-label">Calories Burned</div>
                    </div>
                    <div class="stat-card accent-blue">
                        <div class="stat-icon">⏱️</div>
                        <div class="stat-value">${Math.round(stats.avgDuration)}</div>
                        <div class="stat-label">Avg Minutes</div>
                    </div>
                    <div class="stat-card accent-purple">
                        <div class="stat-icon">💪</div>
                        <div class="stat-value">${stats.bestTrainingLoad.toFixed(1)}</div>
                        <div class="stat-label">Best Training Load</div>
                    </div>
                    <div class="stat-card accent-red">
                        <div class="stat-icon">❤️</div>
                        <div class="stat-value">${stats.avgHR}</div>
                        <div class="stat-label">Avg Heart Rate</div>
                    </div>
                </div>

                <!-- Charts -->
                <div class="charts-grid">
                    <div class="chart-card full-width">
                        <div class="chart-title">📈 Duration & Calories Over Time</div>
                        <div class="chart-container">
                            <canvas id="durationCaloriesChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-title">❤️ Heart Rate Comparison</div>
                        <div class="chart-container small">
                            <canvas id="hrChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-title">💪 Training Load Trend</div>
                        <div class="chart-container small">
                            <canvas id="trainingLoadChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-title">🎯 HR Zone Distribution</div>
                        <div class="chart-container small">
                            <canvas id="hrZoneChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-title">⚡ Intensity Breakdown</div>
                        <div class="chart-container small">
                            <canvas id="intensityChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-title">🔋 Body Battery Cost</div>
                        <div class="chart-container small">
                            <canvas id="batteryChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-title">💧 Water Estimated (ml)</div>
                        <div class="chart-container small">
                            <canvas id="waterChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-title">🎾 Training Effect</div>
                        <div class="chart-container small">
                            <canvas id="teChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Session Cards -->
                <div class="sessions-section">
                    <h2 class="section-title">📋 Session Details</h2>
                    <div class="sessions-grid" id="sessionsGrid"></div>
                </div>

                <footer>
                    <p>Data synced from Garmin Connect • Auto-updates nightly</p>
                    <p><a href="https://github.com/ravaan/badminton-dashboard">View on GitHub</a></p>
                </footer>
            `;

            // Render session cards
            const sessionsGrid = document.getElementById('sessionsGrid');
            sessionsGrid.innerHTML = sessionsNewest.map(session => {
                const totalZoneSec = session.hrZone1Sec + session.hrZone2Sec + session.hrZone3Sec + 
                                    session.hrZone4Sec + session.hrZone5Sec;
                const z1Pct = (session.hrZone1Sec / totalZoneSec * 100).toFixed(0);
                const z2Pct = (session.hrZone2Sec / totalZoneSec * 100).toFixed(0);
                const z3Pct = (session.hrZone3Sec / totalZoneSec * 100).toFixed(0);
                const z4Pct = (session.hrZone4Sec / totalZoneSec * 100).toFixed(0);
                const z5Pct = (session.hrZone5Sec / totalZoneSec * 100).toFixed(0);
                
                const badgeClass = session.trainingEffect === 'RECOVERY' ? 'badge-recovery' : 'badge-aerobic';
                const badgeText = session.trainingEffect === 'RECOVERY' ? 'Recovery' : 'Aerobic Base';
                
                return `
                    <div class="session-card">
                        <div class="session-header">
                            <div>
                                <div class="session-date">${formatDate(session.date)}</div>
                                <div class="session-time">${formatTime(session.startTimeLocal)}</div>
                            </div>
                            <span class="training-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="session-stats">
                            <div class="session-stat">
                                <div class="session-stat-value">${Math.round(session.durationMinutes)}<span style="font-size:0.8rem">min</span></div>
                                <div class="session-stat-label">Duration</div>
                            </div>
                            <div class="session-stat">
                                <div class="session-stat-value" style="color:${COLORS.orange}">${session.calories}</div>
                                <div class="session-stat-label">Calories</div>
                            </div>
                            <div class="session-stat">
                                <div class="session-stat-value" style="color:${COLORS.red}">${session.avgHR}</div>
                                <div class="session-stat-label">Avg HR</div>
                            </div>
                        </div>
                        <div class="hr-zone-bar">
                            <div class="zone zone-1" style="width:${z1Pct}%" title="Zone 1: ${z1Pct}%"></div>
                            <div class="zone zone-2" style="width:${z2Pct}%" title="Zone 2: ${z2Pct}%"></div>
                            <div class="zone zone-3" style="width:${z3Pct}%" title="Zone 3: ${z3Pct}%"></div>
                            <div class="zone zone-4" style="width:${z4Pct}%" title="Zone 4: ${z4Pct}%"></div>
                            <div class="zone zone-5" style="width:${z5Pct}%" title="Zone 5: ${z5Pct}%"></div>
                        </div>
                        <div class="session-details">
                            <div class="detail-item">
                                <span class="detail-label">Max HR</span>
                                <span class="detail-value">${session.maxHR} bpm</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Training Load</span>
                                <span class="detail-value">${session.trainingLoad.toFixed(1)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Body Battery</span>
                                <span class="detail-value">${session.bodyBatteryChange}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Water Est.</span>
                                <span class="detail-value">${session.waterEstimatedMl} ml</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Aerobic TE</span>
                                <span class="detail-value">${session.aerobicTE}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Anaerobic TE</span>
                                <span class="detail-value">${session.anaerobicTE}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Create charts
            const labels = sessionsOldest.map(s => formatDate(s.date));

            // Duration & Calories Chart
            new Chart(document.getElementById('durationCaloriesChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Duration (min)',
                            data: sessionsOldest.map(s => Math.round(s.durationMinutes)),
                            backgroundColor: COLORS.primary + '80',
                            borderColor: COLORS.primary,
                            borderWidth: 2,
                            borderRadius: 6,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Calories',
                            data: sessionsOldest.map(s => s.calories),
                            type: 'line',
                            borderColor: COLORS.orange,
                            backgroundColor: COLORS.orange + '20',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 6,
                            pointHoverRadius: 8,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: { 
                            type: 'linear', 
                            position: 'left',
                            title: { display: true, text: 'Minutes' }
                        },
                        y1: { 
                            type: 'linear', 
                            position: 'right',
                            title: { display: true, text: 'Calories' },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });

            // HR Comparison Chart
            new Chart(document.getElementById('hrChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Avg HR',
                            data: sessionsOldest.map(s => s.avgHR),
                            backgroundColor: COLORS.blue + '80',
                            borderColor: COLORS.blue,
                            borderWidth: 2,
                            borderRadius: 4
                        },
                        {
                            label: 'Max HR',
                            data: sessionsOldest.map(s => s.maxHR),
                            backgroundColor: COLORS.red + '80',
                            borderColor: COLORS.red,
                            borderWidth: 2,
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: { beginAtZero: false, min: 90 }
                    }
                }
            });

            // Training Load Chart
            new Chart(document.getElementById('trainingLoadChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Training Load',
                        data: sessionsOldest.map(s => s.trainingLoad),
                        borderColor: COLORS.secondary,
                        backgroundColor: COLORS.secondary + '20',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        pointBackgroundColor: COLORS.secondary
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // HR Zone Chart (Stacked)
            new Chart(document.getElementById('hrZoneChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Zone 1', data: sessionsOldest.map(s => Math.round(s.hrZone1Sec / 60)), backgroundColor: COLORS.zones[0] },
                        { label: 'Zone 2', data: sessionsOldest.map(s => Math.round(s.hrZone2Sec / 60)), backgroundColor: COLORS.zones[1] },
                        { label: 'Zone 3', data: sessionsOldest.map(s => Math.round(s.hrZone3Sec / 60)), backgroundColor: COLORS.zones[2] },
                        { label: 'Zone 4', data: sessionsOldest.map(s => Math.round(s.hrZone4Sec / 60)), backgroundColor: COLORS.zones[3] },
                        { label: 'Zone 5', data: sessionsOldest.map(s => Math.round(s.hrZone5Sec / 60)), backgroundColor: COLORS.zones[4] }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true, title: { display: true, text: 'Minutes' } }
                    }
                }
            });

            // Intensity Chart
            new Chart(document.getElementById('intensityChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Moderate',
                            data: sessionsOldest.map(s => s.moderateIntensityMin),
                            backgroundColor: COLORS.yellow + '80',
                            borderColor: COLORS.yellow,
                            borderWidth: 2,
                            borderRadius: 4
                        },
                        {
                            label: 'Vigorous',
                            data: sessionsOldest.map(s => s.vigorousIntensityMin),
                            backgroundColor: COLORS.red + '80',
                            borderColor: COLORS.red,
                            borderWidth: 2,
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true, title: { display: true, text: 'Minutes' } }
                    }
                }
            });

            // Body Battery Chart
            new Chart(document.getElementById('batteryChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Body Battery Cost',
                        data: sessionsOldest.map(s => Math.abs(s.bodyBatteryChange)),
                        backgroundColor: sessionsOldest.map(s => 
                            Math.abs(s.bodyBatteryChange) >= 6 ? COLORS.red + '80' : COLORS.primary + '80'
                        ),
                        borderColor: sessionsOldest.map(s => 
                            Math.abs(s.bodyBatteryChange) >= 6 ? COLORS.red : COLORS.primary
                        ),
                        borderWidth: 2,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            // Water Chart
            new Chart(document.getElementById('waterChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Water (ml)',
                        data: sessionsOldest.map(s => s.waterEstimatedMl),
                        backgroundColor: COLORS.blue + '80',
                        borderColor: COLORS.blue,
                        borderWidth: 2,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            // Training Effect Chart
            new Chart(document.getElementById('teChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Aerobic TE',
                            data: sessionsOldest.map(s => s.aerobicTE),
                            backgroundColor: COLORS.primary + '80',
                            borderColor: COLORS.primary,
                            borderWidth: 2,
                            borderRadius: 4
                        },
                        {
                            label: 'Anaerobic TE',
                            data: sessionsOldest.map(s => s.anaerobicTE),
                            backgroundColor: COLORS.secondary + '80',
                            borderColor: COLORS.secondary,
                            borderWidth: 2,
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: { beginAtZero: true, max: 5 }
                    }
                }
            });
        }

        // Load data
        fetch('data/sessions.json')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load session data');
                return response.json();
            })
            .then(data => render(data))
            .catch(error => {
                document.getElementById('app').innerHTML = `
                    <div class="loading">
                        <p style="color: #ff6b6b;">⚠️ ${error.message}</p>
                        <p>Make sure data/sessions.json exists.</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
